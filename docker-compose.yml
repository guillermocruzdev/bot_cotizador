services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Worker de prospección (Bot WhatsApp + cola + scheduler).
  # En producción se recomienda desplegarlo en Railway (ver deploy.md).
  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./prospecting/.baileys:/app/prospecting/.baileys
    command: ["npx", "tsx", "prospecting/worker-entry.ts"]

  # Frontend Next.js (alternativa local a Vercel; habilítalo con --profile web).
  web:
    build: .
    restart: unless-stopped
    profiles: ["web"]
    env_file:
      - .env.local
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npx next build && npx next start -p 3000"]

volumes:
  redis-data:
