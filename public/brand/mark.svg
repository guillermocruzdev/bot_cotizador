<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Nexora">
  <defs>
    <linearGradient id="gx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Hexágono de contorno (marco de red) -->
  <path d="M32 5 L55.4 18.5 L55.4 45.5 L32 59 L8.6 45.5 L8.6 18.5 Z"
        fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Pieza 2: barra derecha de contorno -->
  <rect x="38" y="16" width="9.5" height="32" rx="4.75" fill="none" stroke="#2563EB" stroke-width="2.4"/>
  <!-- Enlace diagonal (el "nexo") -->
  <path d="M21.25 19 L42.75 45" stroke="url(#gx)" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Pieza 1: barra izquierda sólida con gradiente -->
  <rect x="16.5" y="16" width="9.5" height="32" rx="4.75" fill="url(#gx)"/>
  <!-- Nodo central (punto de unión) -->
  <circle cx="32" cy="32" r="5.5" fill="#ffffff" stroke="#1D4ED8" stroke-width="1.6"/>
</svg>
